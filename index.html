<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beyout New Mansoura</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Loading Screen -->
    <div id="loadingScreen">
        <img src="logo.png" id="loadingLogo">
        <h1>Beyout New Mansoura</h1>
        <p>Salam Property Development</p>
        <div class="loader"></div>
        <span>Loading Master Plan...</span>
    </div>

    <!-- Header -->
    <div class="header">
        <img src="logo.png" id="logo">
        <div>
            <h1>Beyout New Mansoura</h1>
            <p>Salam Property Development</p>
        </div>
    </div>

    <!-- Project Info -->
    <div class="project-info">
        <div class="info-card">
            <span class="info-title">🏢 Project</span>
            <span class="info-value">Beyout New Mansoura</span>
        </div>

        <div class="info-card">
            <span class="info-title">🏗️ Buildings</span>
            <span class="info-value">32</span>
        </div>

        <div class="info-card">
            <span class="info-title">🕒 Updated</span>
            <span class="info-value">Today</span>
        </div>
    </div>

    <!-- Search -->
    <div class="toolbar">
        <input type="text" id="searchBuilding" placeholder="🔍 Search Building (A01, B34...)">
    </div>

    <!-- Master Plan -->
    <div class="container">

        <img src="masterplan.jpg" id="masterplan">

        <div class="building" id="A01"></div>
        <div class="building" id="A02"></div>
        <div class="building" id="A39"></div>
        <div class="building" id="A09"></div>
        <div class="building" id="A10"></div>
        <div class="building" id="A20"></div>
        <div class="building" id="A19"></div>
        <div class="building" id="A31"></div>
        <div class="building" id="A32"></div>
        <div class="building" id="A40"></div>

        <div class="building" id="B33"></div>
        <div class="building" id="B34"></div>
        <div class="building" id="B35"></div>
        <div class="building" id="B13"></div>
        <div class="building" id="B12"></div>
        <div class="building" id="B11"></div>
        <div class="building" id="B03"></div>
        <div class="building" id="B04"></div>
        <div class="building" id="B05"></div>
        <div class="building" id="B08"></div>
        <div class="building" id="B07"></div>
        <div class="building" id="B06"></div>

        <div class="building" id="C18"></div>
        <div class="building" id="C17"></div>
        <div class="building" id="C16"></div>
        <div class="building" id="C38"></div>
        <div class="building" id="C37"></div>
        <div class="building" id="C36"></div>

        <div class="building" id="D43"></div>
        <div class="building" id="D44"></div>

        <div class="building" id="E42"></div>
        <div class="building" id="E41"></div>

    </div>

    <!-- Popup -->
    <div class="popup" id="popup">
        <div class="popup-header">
            <h2 id="buildingName"></h2>
        </div>

        <button id="openDrive">Open Availability</button>

        <br><br>

        <button id="close">Close</button>
    </div>

    <!-- Tooltip -->
    <div id="tooltip"></div>

    <script src="buildings.js"></script>
    <script src="script.js"></script>

</body>

</html>
